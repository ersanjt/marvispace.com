<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İletişim — MARVISPACE</title>
  <meta name="description" content="MARVISPACE iletişim — sipariş desteği, iade ve müşteri hizmetleri." />
  <link rel="canonical" href="https://marvispace.com/contact" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta property="og:site_name" content="MARVISPACE" />
  <meta property="og:image" content="https://marvispace.com/assets/images/brand/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://marvispace.com/assets/images/brand/og.jpg" />
  <script type="module" src="/assets/js/core/favicon-loader.js"></script>
  <script type="module" src="/assets/js/core/cookie-consent.js"></script>
  <link rel="stylesheet" href="/assets/css/fonts.css" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/page.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
</head>
<body>
  <header class="site-page-nav">
    <a href="/">‹ MARVISPACE</a>
    <a href="/checkout">Sepet</a>
  </header>
  <main class="site-page site-page--wide">
    <h1>İletişim / Contact</h1>
    <p class="page-lead">Sipariş, iade, ödeme ve ürün sorularınız için bize ulaşın. We respond within 1–2 business days.</p>
    <div data-legal-nav></div>
    <div data-merchant-info></div>

    <div class="contact-channels" id="contactWhatsApp" hidden>
      <a class="contact-whatsapp" id="contactWhatsAppLink" href="#" target="_blank" rel="noopener noreferrer">
        WhatsApp Support
      </a>
    </div>

    <form class="page-form" id="contactForm" action="mailto:support@marvispace.com" method="post" enctype="text/plain">
      <label>
        <span>Ad / Name</span>
        <input type="text" name="name" required autocomplete="name" />
      </label>
      <label>
        <span>E-posta / Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>
        <span>Mesaj / Message</span>
        <input type="text" name="message" required />
      </label>
      <button type="submit" class="page-btn">Gönder / Send</button>
    </form>

    <p class="page-note">Çalışma saatleri: Pazartesi–Cuma 09:00–18:00 (TR)</p>
    <a class="back-shop" href="/">← Mağazaya dön</a>
  </main>
  <footer data-site-footer></footer>
  <script type="module" src="/assets/js/core/legal-page.js"></script>
  <script type="module">
    import { fetchSiteSettings } from '/assets/js/core/api-client.js';
    import { initWhatsAppSupport } from '/assets/js/core/whatsapp-support.js';

    initWhatsAppSupport();

    (async () => {
      try {
        const settings = await fetchSiteSettings();
        const wa = settings?.whatsapp;
        const block = document.getElementById('contactWhatsApp');
        const link = document.getElementById('contactWhatsAppLink');
        if (wa?.enabled && wa?.url && block && link) {
          link.href = wa.url;
          block.hidden = false;
        }
      } catch {
        /* ignore */
      }
    })();
  </script>
  <script type="module" src="/assets/js/core/credits.js"></script>
</body>
</html>
