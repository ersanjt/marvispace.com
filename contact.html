</head>
<body>
  <a class="skip-link" href="#main">İçeriğe atla</a>
  <header class="site-page-nav">
    <a href="/" aria-label="MARVISPACE ana sayfa">
      <img src="/assets/images/brand/mark.svg" width="18" height="18" alt="" decoding="async" style="vertical-align:-4px;margin-right:6px" />
      MARVISPACE
    </a>
    <a href="/checkout">Sepet</a>
  </header>
  <main class="site-page site-page--wide" id="main">
    <h1>İletişim / Contact</h1>
    <p class="page-lead">Sipariş, iade, ödeme ve ürün sorularınız için bize ulaşın. We respond within 1–2 business days.</p>
    <div data-legal-nav></div>
    <div data-merchant-info></div>

    <div class="contact-channels" id="contactWhatsApp" hidden>
      <a class="contact-whatsapp" id="contactWhatsAppLink" href="#" target="_blank" rel="noopener noreferrer">
        WhatsApp Support
      </a>
    </div>

    <form class="page-form" id="contactForm" novalidate>
      <label>
        <span>Ad / Name</span>
        <input type="text" name="name" required autocomplete="name" />
      </label>
      <label>
        <span>E-posta / Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>
        <span>Mesaj / Message</span>
        <textarea name="message" rows="5" required></textarea>
      </label>
      <p class="page-form-status" id="contactFormStatus" hidden role="status"></p>
      <button type="submit" class="page-btn">Gönder / Send</button>
    </form>

    <p class="page-note">Çalışma saatleri: Pazartesi–Cuma 09:00–18:00 (TR) · <a href="mailto:support@marvispace.com">support@marvispace.com</a></p>
    <a class="back-shop" href="/">← Mağazaya dön</a>
  </main>
  <footer data-site-footer></footer>
  <script type="module" src="/assets/js/core/legal-page.js"></script>
  <script type="module">
    import { fetchSiteSettings } from '/assets/js/core/api-client.js';
    import { initWhatsAppSupport } from '/assets/js/core/whatsapp-support.js';
    import { SITE } from '/assets/js/config/site.js';

    initWhatsAppSupport();

    const form = document.getElementById('contactForm');
    const status = document.getElementById('contactFormStatus');

    form?.addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(form);
      const name = String(data.get('name') || '').trim();
      const email = String(data.get('email') || '').trim();
      const message = String(data.get('message') || '').trim();

      if (!name || !email || !message) {
        if (status) {
          status.hidden = false;
          status.textContent = 'Lütfen tüm alanları doldurun.';
        }
        return;
      }

      const subject = encodeURIComponent(`MARVISPACE contact — ${name}`);
      const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\n${message}`);
      window.location.href = `mailto:${SITE.supportEmail}?subject=${subject}&body=${body}`;

      if (status) {
        status.hidden = false;
        status.textContent = 'E-posta uygulamanız açılıyor…';
      }
    });

    (async () => {
      try {
        const settings = await fetchSiteSettings();
        const wa = settings?.whatsapp;
        const block = document.getElementById('contactWhatsApp');
        const link = document.getElementById('contactWhatsAppLink');
        if (wa?.enabled && wa?.url && block && link) {
          link.href = wa.url;
          block.hidden = false;
        }
      } catch {
        /* ignore */
      }
    })();
  </script>
  <script type="module" src="/assets/js/core/credits.js?v=20260825-mobile"></script>
</body>
</html>
